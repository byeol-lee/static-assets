<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 처리 중</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #fff; color: #252525; }
    body { display: flex; align-items: center; justify-content: center; }
    .wrap { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 32px; text-align: center; }
    .spinner { width: 34px; height: 34px; border: 3px solid #e5e7eb; border-top-color: #555; border-radius: 50%; animation: spin .8s linear infinite; }
    .title { font-size: 18px; font-weight: 600; }
    .desc { font-size: 13px; color: #737373; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
  </style>
</head>
<body>
  <main class="wrap" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="title">로그인 처리 중입니다!!!!!!!!!!!!!!!</div>
    <div class="desc">인증이 완료되면 템플릿 생성기로 이동합니다.</div>
  </main>
</body>
</html>
