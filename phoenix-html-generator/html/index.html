<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Phoenix HTML Generator</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="package-renewal-cms.css" />
</head>

<body>

    <div id="phoenix-workspace-tabs" class="phoenix-workspace-tabs"></div>
    <div class="app-container app-container-workspace">
        <div class="admin-panel">
            <!-- <h2>객실 패키지</h2> -->
            <div class="form-section">
                <h3>1. 메인 섹션</h3>
                <div class="form-group">
                    <label for="in-property">구분</label>
                    <select id="in-property" required>
                        <option value="" disabled selected>지점 선택</option>
                        <option value="PHOENIX PARK">PHOENIX PARK</option>
                        <option value="PHOENIX ISLAND">PHOENIX ISLAND</option>
                        <option value="PLAYCE CAMP by PHOENIX">PLAYCE CAMP by PHOENIX</option>
                    </select>
                </div>

                <div class="form-group">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
                        <label style="margin:0;">객실 패키지 사진(1920×1080)</label>
                        <div style="display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:0;">
                            <span id="main-img-file-name" class="file-name-display" style="font-size:11px;color:#333;display:inline-block;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">example.jpg</span>
                            <label for="in-main-img" class="custom-file-btn" style="flex-shrink:0;">파일 선택</label>
                            <input type="file" id="in-main-img" accept="image/*" style="display:none;">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>객실 패키지 홍보(선택)/줄바꿈 시 <code>&lt;br /&gt;</code> 사용
                    </label>
                    <input type="text" id="in-main-badge" placeholder="혜택<br />추가">
                </div>
                <div class="form-group">
                    <label>객실 패키지명</label>
                    <input type="text" id="in-main-title" placeholder="객실 패키지명">
                </div>
                <div class="form-group">
                    <label>객실 패키지 설명</label>
                    <textarea id="in-main-desc" placeholder="객실 패키지 설명"></textarea>
                </div>
                <div class="form-group">
                    <label>예약 기간</label>
                    <div class="date-range-control"><input type="hidden" id="in-info-reserve-period"
                            class="date-range-display">
                        <div class="date-range-pickers"><label class="date-picker-field"><span
                                    class="date-picker-caption">0000.00.00</span>
                                <span class="date-picker-value"></span>

                                <input type="date" class="date-range-start" aria-label="예약 시작일 선택"></label><span
                                class="date-range-separator">-</span><label class="date-picker-field"><span
                                    class="date-picker-caption">0000.00.00</span>
                                <span class="date-picker-value"></span><input type="date" class="date-range-end"
                                    aria-label="예약 종료일 선택"></label></div>
                    </div>
                </div>
                <div class="form-group">
                    <label>투숙 기간</label>
                    <div class="date-range-control"><input type="hidden" id="in-info-stay-period"
                            class="date-range-display">
                        <div class="date-range-pickers"><label class="date-picker-field"><span
                                    class="date-picker-caption">0000.00.00</span>
                                <span class="date-picker-value"></span><input type="date" class="date-range-start"
                                    aria-label="투숙 시작일 선택"></label><span class="date-range-separator">-</span><label
                                class="date-picker-field"><span class="date-picker-caption">0000.00.00</span>
                                <span class="date-picker-value"></span><input type="date" class="date-range-end"
                                    aria-label="투숙 종료일 선택"></label></div>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h3>2. 혜택 영역</h3>
                <div class="form-group">
                    <label>추가 혜택명</label>
                    <input type="text" id="in-cta-title" placeholder="추가 혜택명">
                </div>
                <div class="form-group">
                    <label>추가 혜택 상세</label>
                    <textarea id="in-cta-desc" placeholder="추가 혜택 상세"></textarea>
                </div>
            </div>

            <div class="form-section">
                <h3>3. 상품 구성 상세(최대 10개)</h3>
                <div id="card-form-container"></div>
                <button type="button" class="btn-add-card" id="btn-add-card">+ 구성 추가</button>
            </div>

            <div class="form-section">
                <h3>4. 이용 안내</h3>
                <div class="form-group">
                    <!-- <label>안내 항목들 (줄바꿈으로 구분)</label> -->
                    <textarea id="in-bullets" class="textarea-bullets" placeholder="이용 안내 상세"></textarea>
                </div>
            </div>

            <div class="form-section">
                <h3>5. 이용 요금</h3>
                <div id="stay-form-container"></div>
                <button type="button" class="btn-add-stay" id="btn-add-stay">+ 항목 추가</button>
            </div>
        </div>

        <div class="preview-panel">
            <div class="preview-header">
                <span class="preview-title">미리보기</span>
                <div class="preview-header-actions">
                    <button class="btn-action" id="btn-copy-html">HTML 복사</button>
                    <button class="btn-action" id="btn-save-html" type="button">HTML 저장</button>
                </div>
            </div>

            <div class="preview-body preview-body-column">
                <div class="preview-controls">
                    <div class="preview-presets">
                        <button class="btn-secondary btn-device-size" data-width="320">320px</button>
                        <button class="btn-secondary btn-device-size" data-width="375">375px</button>
                        <button class="btn-secondary btn-device-size" data-width="1920">1920px</button>
                    </div>
                </div>

                <div class="mobile-frame-container" id="mobile-frame-container">
                    <div class="mobile-frame mobile-frame-fluid">
                        <iframe class="mobile-screen" id="preview-frame" title="미리보기"
                            class="mobile-screen preview-frame"
                            srcdoc="<!doctype html><html lang='ko'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0, viewport-fit=cover'></head><body></body></html>"></iframe>
                    </div>
                </div>
            </div>

            <div class="code-container" id="code-output">
                <!-- <button class="btn-secondary btn-copy-html" id="btn-copy-html">코드 전체 복사</button> -->
                <pre><code id="code-text"></code></pre>
            </div>
        </div>
    </div>

    <!-- 분리된 외부 JS 파일 로드 -->
    <script src="package-renewal-cms.js"></script>

</body>

</html>
