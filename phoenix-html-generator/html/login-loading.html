<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>log-in</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            font-family: 'Pretendard', sans-serif;
            background: #fff;
            color: #222;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 32px;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 1px solid #e8e8e8;
            border-top-color: #666;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }

        .title {
            font-size: 18px;
            font-weight: 600;
        }

        .desc {
            font-size: 13px;
            color: #737373;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
            }
        }
    </style>
</head>

<body>
    <main class="wrap" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <!-- <div class="title">loading</div>
        <div class="desc">loading</div> -->
    </main>
</body>

</html>
